<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12100e" />
    <meta
      name="description"
      content="Sela is a contemporary restaurant in Jakarta serving seasonal food shaped by fire, produce and the people who grow it. Reserve a table or explore the menu."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sela | Seasonal dining in Jakarta" />
    <meta
      property="og:description"
      content="Seasonal cooking. Warm hospitality. A place to stay a little longer."
    />
    <meta property="og:image" content="/assets/hero.webp" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/assets/hero.webp" />
    <link rel="stylesheet" href="/style.css" />
    <title>Sela | Seasonal dining in Jakarta</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Sela",
        "description": "Seasonal contemporary dining in Jakarta",
        "servesCuisine": "Contemporary",
        "image": "/assets/hero.webp",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "18 Jalan Senopati",
          "addressLocality": "Jakarta Selatan",
          "addressCountry": "ID"
        },
        "telephone": "+62 21 555 0188",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday",
              "Sunday"
            ],
            "opens": "17:30",
            "closes": "22:00"
          }
        ]
      }
    </script>
    <script id="menu-data" type="application/json">__MENU_JSON__</script>
    <script type="module" src="/app.mjs?v=2"></script>
  </head>

    <div id="app"><p class="loading">Preparing your table…</p></div>
  </body>
</html>
